openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Ibn Al-Qayyim Legacy API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: books
    description: Books by Ibn Al-Qayyim
  - name: chapters
    description: Book chapters
  - name: highlights
    description: Text highlights
  - name: notes
    description: Reader notes
  - name: comments
    description: Reader comments
  - name: search
    description: Search operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /books:
    get:
      operationId: listBooks
      tags: [books]
      summary: List all books
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"

  /books/{bookId}:
    get:
      operationId: getBook
      tags: [books]
      summary: Get a single book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Not found

  /books/{bookId}/chapters:
    get:
      operationId: listChapters
      tags: [chapters]
      summary: List chapters for a book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"

  /chapters/{chapterId}:
    get:
      operationId: getChapter
      tags: [chapters]
      summary: Get a chapter with full content
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chapter content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "404":
          description: Not found

  /highlights:
    get:
      operationId: listHighlights
      tags: [highlights]
      summary: Get highlights for a chapter
      parameters:
        - name: chapterId
          in: query
          required: true
          schema:
            type: integer
        - name: sessionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of highlights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Highlight"
    post:
      operationId: createHighlight
      tags: [highlights]
      summary: Create a highlight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HighlightCreate"
      responses:
        "201":
          description: Created highlight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlight"

  /highlights/{highlightId}:
    delete:
      operationId: deleteHighlight
      tags: [highlights]
      summary: Delete a highlight
      parameters:
        - name: highlightId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: Get notes for a chapter
      parameters:
        - name: chapterId
          in: query
          required: true
          schema:
            type: integer
        - name: sessionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteCreate"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{noteId}:
    put:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: Get comments for a chapter
      parameters:
        - name: chapterId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Create a comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /search:
    get:
      operationId: searchTexts
      tags: [search]
      summary: Search across all books and chapters
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: bookId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"

  /stats:
    get:
      operationId: getStats
      tags: [books]
      summary: Get library statistics
      responses:
        "200":
          description: Library stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStats"

  /categories:
    get:
      operationId: listCategories
      tags: [books]
      summary: List book categories with counts
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        titleAr:
          type: string
        description:
          type: string
        category:
          type: string
        chapterCount:
          type: integer
        coverColor:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - titleAr
        - description
        - category
        - chapterCount
        - coverColor
        - createdAt

    Chapter:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        title:
          type: string
        titleAr:
          type: string
        content:
          type: string
        orderIndex:
          type: integer
        level:
          type: integer
          description: Hierarchy level — 1=باب, 2=فصل, 3+=فصل فرعي
        parentId:
          type: integer
          nullable: true
          description: Parent chapter id (null for top-level بوابان)
      required:
        - id
        - bookId
        - title
        - titleAr
        - content
        - orderIndex
        - level

    Highlight:
      type: object
      properties:
        id:
          type: integer
        chapterId:
          type: integer
        sessionId:
          type: string
        selectedText:
          type: string
        startOffset:
          type: integer
        endOffset:
          type: integer
        color:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - chapterId
        - sessionId
        - selectedText
        - startOffset
        - endOffset
        - color
        - createdAt

    HighlightCreate:
      type: object
      properties:
        chapterId:
          type: integer
        sessionId:
          type: string
        selectedText:
          type: string
        startOffset:
          type: integer
        endOffset:
          type: integer
        color:
          type: string
      required:
        - chapterId
        - sessionId
        - selectedText
        - startOffset
        - endOffset
        - color

    Note:
      type: object
      properties:
        id:
          type: integer
        chapterId:
          type: integer
        sessionId:
          type: string
        content:
          type: string
        selectedText:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - chapterId
        - sessionId
        - content
        - createdAt
        - updatedAt

    NoteCreate:
      type: object
      properties:
        chapterId:
          type: integer
        sessionId:
          type: string
        content:
          type: string
        selectedText:
          type: string
      required:
        - chapterId
        - sessionId
        - content

    NoteUpdate:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    Comment:
      type: object
      properties:
        id:
          type: integer
        chapterId:
          type: integer
        authorName:
          type: string
        content:
          type: string
        parentId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
      required:
        - id
        - chapterId
        - authorName
        - content
        - createdAt

    CommentCreate:
      type: object
      properties:
        chapterId:
          type: integer
        authorName:
          type: string
        content:
          type: string
        parentId:
          type: integer
          nullable: true
      required:
        - chapterId
        - authorName
        - content

    SearchResult:
      type: object
      properties:
        chapterId:
          type: integer
        chapterTitle:
          type: string
        bookId:
          type: integer
        bookTitle:
          type: string
        snippet:
          type: string
        matchCount:
          type: integer
      required:
        - chapterId
        - chapterTitle
        - bookId
        - bookTitle
        - snippet
        - matchCount

    LibraryStats:
      type: object
      properties:
        totalBooks:
          type: integer
        totalChapters:
          type: integer
        totalHighlights:
          type: integer
        totalNotes:
          type: integer
        totalComments:
          type: integer
        categories:
          type: integer
      required:
        - totalBooks
        - totalChapters
        - totalHighlights
        - totalNotes
        - totalComments
        - categories

    Category:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
        - name
        - count
