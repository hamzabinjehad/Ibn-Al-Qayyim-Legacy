kind = "web"
previewPath = "/"
title = "موروث ابن القيم"
version = "1.0.0"
id = "artifacts/ibn-al-qayyim"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24351

[services.development]
run = "pnpm --filter @workspace/ibn-al-qayyim run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ibn-al-qayyim", "run", "build" ]
publicDir = "artifacts/ibn-al-qayyim/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24351"
BASE_PATH = "/"
